name: comparewine_flutter
description: A Flutter app for comparing wine prices from Excel files
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Excel file reading and writing
  excel: ^4.0.3

  # File picker for selecting Excel files
  file_picker: ^6.1.1

  # Path provider for file storage
  path_provider: ^2.1.1

  # State management
  provider: ^6.1.1

  # UI components
  cupertino_icons: ^1.0.6
  data_table_2: ^2.5.11

  # File handling
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Add sample Excel files as assets
  assets:
    - assets/wineprice/
